# Compila el visor y lo publica en GitHub Pages.
#
# Requiere que en Settings -> Pages el "Source" este puesto en "GitHub Actions".
# Con "Deploy from a branch" este workflow se ejecuta pero el despliegue falla:
# esa opcion publica los ficheros del repo sin compilar, y el visor necesita el
# empaquetado de Vite para resolver las dependencias.

name: Desplegar en GitHub Pages

on:
  push:
    branches: [claude/iphone-point-cloud-viewer-4ub9y3]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez; si llegan varios pushes seguidos, gana el ultimo.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
